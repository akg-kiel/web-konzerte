# Cloudflare Workers configuration for web-konzerte
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "web-konzerte"
compatibility_date = "2026-01-19"

# Static assets configuration
# The dist folder contains the Astro build output
[assets]
directory = "./dist"

# Custom headers for caching static assets
[[headers]]
include = "/_astro/*"
name = "cache-control"
value = "public, max-age=31536000, immutable"
