name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Install devenv from locked Nixpkgs
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)#devenv"

      - name: Run quality checks and build in devenv
        run: devenv test --clean

      - name: Check lockfiles are unchanged
        run: git diff --exit-code -- devenv.lock pnpm-lock.yaml
