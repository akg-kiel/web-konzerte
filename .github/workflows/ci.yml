name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run CI gate
        run: mise run ci
