name: Babysitter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  babysitter-project-check:
    name: Babysitter project check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
          run-install: true

      - name: Run project quality gate
        run: vp run quality

      - name: Install Babysitter SDK
        run: npm install --no-save @a5c-ai/babysitter-sdk@0.0.187

      - name: Validate Babysitter project profile
        run: |
          npx babysitter health --json
          npx babysitter profile:read --project --json

      # Optional full Babysitter CI orchestration hook.
      # Enable only after selecting a CI-compatible harness and adding required credentials.
      - name: Babysitter PR orchestration (optional)
        if: vars.BABYSITTER_CI_ENABLED == 'true'
        env:
          BABYSITTER_HARNESS: ${{ vars.BABYSITTER_HARNESS }}
          BABYSITTER_PROMPT: >-
            Review this pull request for the Konzertkirche Astro site. Focus on
            Vite+ quality gates, Astro/Tailwind conventions, accessibility,
            responsive behavior, and fidelity to Stitch/concept references.
        run: |
          npx babysitter harness:yolo \
            --harness "${BABYSITTER_HARNESS:-anycli}" \
            --workspace "$GITHUB_WORKSPACE" \
            --prompt "$BABYSITTER_PROMPT" \
            --json
