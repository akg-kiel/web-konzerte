version: 1.0.0
title: Linear Ticket Refiner
description: Transforms raw Linear tickets into well-structured, actionable tasks with clear problem statements, acceptance criteria, and technical notes.
instructions: 'Fetch the ticket with ID {{ ticket_id }} using the Linear tool and analyze for clarity. If vague, ask specific clarifying questions to fill gaps about problem, goals, scope, or deliverables. Once answers are provided, synthesize into a professional format with sections: Problem, Proposed Solution, Acceptance Criteria (as a checklist), and Technical Notes. Update the ticket with the refined title and description using the Linear update tool.'

parameters:
  - key: ticket_id
    input_type: string
    requirement: required
    description: Linear Ticket that should be refined

extensions:
  - type: stdio
    name: Linear
    description: Access Linear.
    cmd: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.linear.app/mcp
    envs: {}
    env_keys: []
    timeout: 300
    bundled: null
    available_tools: []

settings:
  goose_provider: openrouter
  goose_model: anthropic/claude-opus-4.5
  temperature: 0.0

activities:
  - Refine vague ticket
  - Structure ticket description
  - Add acceptance criteria
  - Update ticket labels

author:
  contact: zepi
